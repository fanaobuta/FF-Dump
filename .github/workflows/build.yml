name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game (ví dụ: com.dts.freefiremax):"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4          # Nên nâng lên v4 luôn cho ổn định
    - uses: actions/setup-java@v4       # Nâng lên v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle

    - run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
        path: out/magisk_module_release/
